<html lang="es">
<head>
<meta charset="utf-8">

<title>Explorador DOCUMENTACION CyD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

luna:'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/><path d="M17 4.5v3M15.5 6h3"/>'},r=document.documentElement,m;
try{m=localStorage.getItem(K)}catch(e){}

function pinta(b){b.innerHTML='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+I[m]+'</svg>'+L[m];b.title="Modo de visualización: "+L[m]+". Pulse para cambiar a "+L[M[(M.indexOf(m)+1)%3]];b.setAttribute("aria-label",b.title)}
function ini(){var b=document.getElementById("btn-modo");if(!b)return;pinta(b);b.addEventListener("click",function(){m=M[(M.indexOf(m)+1)%3];r.classList.add("cambio");r.setAttribute("data-modo",m);try{localStorage.setItem(K,m)}catch(e){}pinta(b);setTimeout(function(){r.classList.remove("cambio")},500)})}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",ini);else ini()})();

<style>
/* Disposición: consola de control documental. Árbol de series a la izquierda, registro al centro, ficha a la derecha. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --sunk:#f5f7f9; --ink:#17232e; --mute:#5b6b79; --line:#d8dfe5;
  --accent:#0b6a83; --accent-soft:#dcedf2; --accent-ink:#ffffff;
  --ok:#23785a; --warn:#a4660b; --crit:#b23a31;
  --t-pdf:#b23a31; --t-xls:#23785a; --t-doc:#2c5fa8; --t-ppt:#b5602a; --t-img:#7a4f9e; --t-cad:#0b6a83; --t-mail:#8a6d1d; --t-zip:#5b6b79; --t-oth:#5b6b79;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171d; --panel:#18222a; --sunk:#141d24; --ink:#e4ebf0; --mute:#93a4b1; --line:#2b3944;
  --accent:#4fb3cc; --accent-soft:#17343f; --accent-ink:#08232c;
  --ok:#57bd97; --warn:#e0a54b; --crit:#ef8077;
  --t-pdf:#ef8077; --t-xls:#57bd97; --t-doc:#7fa9e6; --t-ppt:#e89a63; --t-img:#b893d8; --t-cad:#4fb3cc; --t-mail:#d2b65c; --t-zip:#93a4b1; --t-oth:#93a4b1;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10171d; --panel:#18222a; --sunk:#141d24; --ink:#e4ebf0; --mute:#93a4b1; --line:#2b3944;
  --accent:#4fb3cc; --accent-soft:#17343f; --accent-ink:#08232c;
  --ok:#57bd97; --warn:#e0a54b; --crit:#ef8077;
  --t-pdf:#ef8077; --t-xls:#57bd97; --t-doc:#7fa9e6; --t-ppt:#e89a63; --t-img:#b893d8; --t-cad:#4fb3cc; --t-mail:#d2b65c; --t-zip:#93a4b1; --t-oth:#93a4b1;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--body);display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
a{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 11px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-weight:500;font-size:13px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}

header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{min-width:0;flex:1 1 280px}
.brand h1{font:600 20px/1.15 var(--display);margin:0;letter-spacing:.01em}
.brand p{margin:1px 0 0;color:var(--mute);font-size:12.5px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.status.ok .dot{background:var(--ok)} .status.busy .dot{background:var(--warn);animation:pulse 1.1s infinite} .status.err .dot{background:var(--crit)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.status.busy .dot{animation:none}}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpi{background:var(--panel);padding:8px 18px;border:0;text-align:left;display:block;width:100%}
button.kpi:hover{background:var(--accent-soft)}
.kpi.on{background:var(--accent-soft);box-shadow:inset 0 -2px var(--accent)}
.kpi b{display:block;font:600 21px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{color:var(--mute);font-size:12px}

#banner{display:none;padding:8px 18px;gap:12px;align-items:center;font-size:13px;background:var(--accent-soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
#banner.show{display:flex}
#banner.err{background:color-mix(in srgb,var(--crit) 13%,var(--panel))}

main{flex:1;min-height:0;display:grid;grid-template-columns:286px minmax(0,1fr) 0;transition:grid-template-columns .15s}
main.detail{grid-template-columns:286px minmax(0,1fr) 370px}
@media (prefers-reduced-motion:reduce){main{transition:none}}

#tree{background:var(--sunk);border-right:1px solid var(--line);overflow:auto;padding:8px 6px 20px}
.tn{display:flex;align-items:center;width:100%;border:0;background:none;text-align:left;padding:0;border-radius:4px}
.tn:hover{background:var(--accent-soft)}
.tn.cur{background:var(--accent);color:var(--accent-ink)}
.tn.cur .ct,.tn.cur .tw{color:inherit}
.tw{width:20px;height:27px;display:inline-flex;align-items:center;justify-content:center;color:var(--mute);flex:none;font-size:10px;border:0;background:none;padding:0}
.tl{flex:1;min-width:0;padding:4px 4px 4px 0;overflow-wrap:anywhere;font-size:13px;line-height:1.3;border:0;background:none;text-align:left}
.ct{font:400 11.5px var(--mono);color:var(--mute);padding-right:6px;font-variant-numeric:tabular-nums}
.ser{font:500 11px var(--mono);margin-right:6px;opacity:.75}

#center{display:flex;flex-direction:column;min-width:0;min-height:0}
.tools{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 300px;position:relative;display:flex}
.search input{width:100%;height:36px;padding:0 34px 0 34px;border:1px solid var(--line);border-radius:5px;background:var(--sunk)}
.search svg{position:absolute;left:10px;top:10px;color:var(--mute)}
#clearq{position:absolute;right:4px;top:4px;width:28px;height:28px;border:0;background:none;color:var(--mute);display:none}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 10px;font-size:12.5px;min-height:26px;display:inline-flex;gap:5px;align-items:center}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip i{font:400 11px var(--mono);font-style:normal;opacity:.75}
.fld{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mute)}
.fld input,.fld select{height:30px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:0 6px;color:var(--ink);max-width:190px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:0 10px;height:30px;font-size:12.5px}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

.crumbs{display:flex;gap:3px;align-items:center;flex-wrap:wrap;padding:7px 16px;font-size:13px;border-bottom:1px solid var(--line);background:var(--sunk)}
.crumbs button{border:0;background:none;padding:1px 3px;border-radius:3px;color:var(--accent);overflow-wrap:anywhere;text-align:left}
.crumbs button:hover{background:var(--accent-soft)}
.crumbs .s{color:var(--mute)}
.crumbs .sum{margin-left:auto;color:var(--mute);font-size:12.5px;padding-left:12px}

#list{flex:1;min-height:0;overflow:auto;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--panel);z-index:1;border-bottom:1px solid var(--line);text-align:left;padding:0;font-weight:600;color:var(--mute);font-size:12px}
th button{border:0;background:none;padding:7px 10px;width:100%;text-align:left;font-weight:600;color:inherit;white-space:nowrap}
th button:hover{color:var(--accent)}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover{background:var(--sunk)}
tr.row.sel{background:var(--accent-soft)}
.nm{display:flex;gap:9px;align-items:flex-start;min-width:0}
.nm div{min-width:0;overflow-wrap:anywhere}
.nb{border:0;background:none;padding:0;text-align:left;font-weight:500;overflow-wrap:anywhere}
.pth{color:var(--mute);font-size:12px;margin-top:1px}
.snip{color:var(--mute);font-size:12px;margin-top:3px;border-left:2px solid var(--accent);padding-left:7px}
.ty{font:500 10.5px/18px var(--mono);width:36px;height:18px;text-align:center;border-radius:3px;flex:none;margin-top:1px;border:1px solid currentColor}
.n{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--mute)}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:14px}
.card{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:5px;min-height:92px}
.card:hover{border-color:var(--accent)}
.card.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card strong{font-weight:500;overflow-wrap:anywhere}
.more{padding:14px;text-align:center}
.empty{padding:46px 20px;text-align:center;color:var(--mute);max-width:520px;margin:auto}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

#detail{background:var(--panel);border-left:1px solid var(--line);overflow:auto;min-width:0;visibility:hidden}
main.detail #detail{visibility:visible}
.dbody{padding:16px;display:flex;flex-direction:column;gap:14px;width:370px;max-width:100%}
.dhead{display:flex;gap:10px;align-items:flex-start}
.dhead h2{font:600 17px/1.25 var(--display);margin:0;flex:1;overflow-wrap:anywhere;text-wrap:balance}
.x{border:0;background:none;width:28px;height:28px;color:var(--mute);font-size:17px;flex:none}
dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:5px 10px;font-size:13px}
dt{color:var(--mute)} dd{margin:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px}
#txt{background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:10px;font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:46vh;overflow:auto;margin:0}
.note{font-size:12px;color:var(--mute);margin:0}
#menuTree{display:none}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:7px 14px;border-radius:5px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
#toast.show{opacity:1}
@media (max-width:1040px){
  main,main.detail{grid-template-columns:240px minmax(0,1fr)}
  #detail{position:fixed;top:0;right:0;bottom:0;width:min(370px,100%);z-index:10;box-shadow:-6px 0 22px rgba(0,0,0,.25);display:none}
  main.detail #detail{display:block}
}
@media (max-width:720px){
  body{overflow:auto;display:block;height:auto}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:7px 16px}
  main,main.detail{display:block}
  #menuTree{display:inline-flex}
  #tree{display:none;max-height:50vh;border-right:0;border-bottom:1px solid var(--line)}
  #tree.open{display:block}
  #list{overflow:auto;max-height:none}
  .cHide{display:none}
}
/* Fotografías tenues en rotación detrás de los paneles translúcidos */
.fondo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fondo i{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2.4s ease}
.fondo i.on{opacity:.55}
header,.kpis,#banner,main{position:relative;z-index:1}
:root{--glass:color-mix(in srgb,var(--panel) 74%,transparent);--glass2:color-mix(in srgb,var(--sunk) 74%,transparent)}
header,.tools,#list,#detail,.kpi{background:var(--glass)}
#tree,.crumbs{background:var(--glass2)}
.kpis{background:none;gap:0}
.kpi+.kpi{border-left:1px solid var(--line)}
button.kpi:hover,.kpi.on{background:color-mix(in srgb,var(--accent-soft) 80%,transparent)}
@media (max-width:1040px){#detail{background:var(--panel)}}
/* Modos de visualización y realce */
:root[data-modo="dia"]{--bg:#e9eef3;--panel:#ffffff;--sunk:#f3f6f9;--ink:#14212c;--mute:#50616f;--line:#c9d3db;--accent:#007f9e;--accent-soft:#d3ecf3;--accent-ink:#ffffff;--ok:#16805a;--warn:#a4660b;--crit:#c02f25;--t-pdf:#c02f25;--t-xls:#16805a;--t-doc:#1f5fc2;--t-ppt:#c25a1c;--t-img:#7d44b0;--t-cad:#007f9e;--t-mail:#866a10;--t-zip:#50616f;--t-oth:#50616f;--violeta:#6a43d6;color-scheme:light}
:root[data-modo="noche"]{--bg:#0d141a;--panel:#17212a;--sunk:#121a21;--ink:#e8eff4;--mute:#9db0be;--line:#2f404d;--accent:#3fc1de;--accent-soft:#143744;--accent-ink:#06222b;--ok:#4fd0a2;--warn:#eeb054;--crit:#ff8378;--t-pdf:#ff8378;--t-xls:#4fd0a2;--t-doc:#84b2f2;--t-ppt:#f2a169;--t-img:#c29ce4;--t-cad:#3fc1de;--t-mail:#dcc060;--t-zip:#9db0be;--t-oth:#9db0be;--violeta:#a98bf5;color-scheme:dark}
:root[data-modo="luna"]{--bg:#0b1030;--panel:#171e48;--sunk:#121839;--ink:#eef1ff;--mute:#aeb8e0;--line:#333f7c;--accent:#aebfff;--accent-soft:#262f68;--accent-ink:#0d1336;--ok:#66e0c4;--warn:#f3c76f;--crit:#ff8fa8;--t-pdf:#ff8fa8;--t-xls:#66e0c4;--t-doc:#9db7ff;--t-ppt:#f6ad7c;--t-img:#cdb0ff;--t-cad:#7fe0ee;--t-mail:#f3c76f;--t-zip:#aeb8e0;--t-oth:#aeb8e0;--violeta:#c9b3ff;color-scheme:dark}
:root[data-modo="noche"] .fondo i{filter:brightness(.8)}
:root[data-modo="luna"] .fondo i{filter:grayscale(.65) brightness(.72) sepia(.15) hue-rotate(190deg)}
.cambio *{transition:background-color .4s,color .4s,border-color .4s!important}
.btn{border:1.5px solid var(--accent);color:var(--accent);font-weight:600}
.btn:hover{background:var(--accent);color:var(--accent-ink)}
.btn.modo{background:var(--violeta);border-color:var(--violeta);color:var(--panel)}
.btn.modo:hover{background:var(--violeta);color:var(--panel);filter:brightness(1.12)}
.btn.primary{box-shadow:0 5px 14px -5px var(--accent)}
.nav{border:1.5px solid var(--accent)}
.nav button{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:not(:disabled):hover{background:var(--accent);color:var(--accent-ink)}
.chip{border-width:1.5px;font-weight:500}
.chip.on{box-shadow:0 3px 10px -3px var(--accent)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.ty{border:0;color:var(--panel);font-weight:600}
.kpi b{color:var(--accent)}
.tn.cur{font-weight:600;box-shadow:0 3px 10px -4px var(--accent)}
.crumbs button{font-weight:500}
th{color:var(--accent)}
/* Efectos visuales */
.fondo i{animation:kb 42s ease-in-out infinite alternate;will-change:transform}
@keyframes kb{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.1) translate3d(-1.5%,-1%,0)}}
#prog{position:absolute;left:0;right:0;bottom:-1px;height:3px;opacity:0;transition:opacity .3s;overflow:hidden}
#prog.on{opacity:1}
#prog i{display:block;height:100%;width:0;transition:width .4s ease;background:linear-gradient(90deg,var(--accent),var(--ok),var(--accent));background-size:200% 100%;animation:flujo 1.3s linear infinite}
@keyframes flujo{to{background-position:-200% 0}}
.btn,.chip,.seg button,.card,.tn,.kpi{transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease,border-color .16s ease,color .16s ease}
.btn:not(:disabled):hover,.chip:hover{transform:translateY(-1px);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 24%,transparent)}
.btn:not(:disabled):active,.chip:active,.seg button:active{transform:scale(.95)}
.tn:hover{transform:translateX(3px)}
.kpi:hover{box-shadow:inset 0 -2px var(--accent)}
.search input{transition:box-shadow .2s,border-color .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
tr.row{transition:background-color .15s,box-shadow .15s}
tr.row:hover{box-shadow:inset 3px 0 var(--accent)}
tr.row.sel{box-shadow:inset 3px 0 var(--accent)}
.ty{transition:transform .16s}
tr.row:hover .ty,.card:hover .ty{transform:scale(1.12)}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 22px color-mix(in srgb,var(--ink) 18%,transparent)}
.in{animation:entra .34s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i)*16ms)}
@keyframes entra{from{opacity:0;transform:translateY(9px)}}
.dbody{animation:ficha .28s cubic-bezier(.2,.7,.3,1) both}
@keyframes ficha{from{opacity:0;transform:translateX(26px)}}
.pulse b{animation:pulso .7s ease}
@keyframes pulso{40%{transform:scale(1.14);color:var(--accent)}}
.kpi b{transform-origin:left center}
.nav button{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px;font-weight:500}
.nav button:disabled{opacity:.4;cursor:default}
.nav button:not(:disabled):hover{color:var(--accent);background:var(--accent-soft)}
.nav button+button{border-left:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.fondo i,#prog i,.in,.dbody,.pulse b{animation:none}.fondo i{transition:none}.btn,.chip,.seg button,.card,.tn,.kpi,.ty,tr.row{transition:none;transform:none!important}}
</style>
</head>
<body>
<div class="fondo" aria-hidden="true"></div>
<header>
  <div class="brand">
    <h1>Explorador DOCUMENTACION · Planta Desaladora Coquimbo</h1>
    <p>Repositorio documental CyD en Google Drive, consulta en modo lectura con actualización automática semanal</p>
  </div>
  <span id="status" class="status"><span class="dot"></span><span id="statusT">Iniciando</span></span>
  <button id="btn-modo" class="btn modo" type="button">Modo</button>
  <button id="refresh" class="btn primary" type="button">Actualizar índice</button>
  <div id="prog" aria-hidden="true"><i></i></div>
</header>

<section class="kpis" id="kpis" aria-label="Resumen del repositorio"></section>
<div id="banner" role="status"></div>

<main id="main">
  <nav id="tree" aria-label="Carpetas"></nav>
  <section id="center">
    <div class="tools">
      <div class="r">
        <button id="menuTree" class="btn" type="button">Carpetas</button>
        <div class="seg nav" role="group" aria-label="Historial de consulta">
          <button id="navB" type="button" disabled title="Volver a la consulta anterior (Alt + ←)">← Volver</button><button id="navF" type="button" disabled title="Avanzar a la consulta siguiente (Alt + →)">Avanzar →</button>
        </div>
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg>
          <input id="q" type="search" autocomplete="off" placeholder="Buscar por nombre o ruta: folio 67, PEPID, USCI 4, .xlsx" aria-label="Buscar por nombre o ruta">
          <button id="clearq" type="button" aria-label="Limpiar búsqueda">✕</button>
        </div>
        <button id="ctSearch" class="btn primary" type="button" title="Busca el texto dentro de los documentos mediante Google Drive">Buscar en contenido</button>

          <button id="vList" type="button" class="on">Lista</button><button id="vCards" type="button">Fichas</button>
        </div>

        <label class="fld" for="from">Modificado desde <input id="from" type="date"></label>
        <label class="fld" for="to">hasta <input id="to" type="date"></label>
        <div class="chips" id="datePre">
          <button class="chip" type="button" data-d="7">7 días</button>
          <button class="chip" type="button" data-d="30">30 días</button>
          <button class="chip" type="button" data-d="90">90 días</button>
        </div>
        <label class="fld" for="owner">Propietario <select id="owner"><option value="">Todos</option></select></label>
        <label class="fld" for="flat"><input id="flat" type="checkbox"> Incluir subcarpetas</label>
        <button id="clearAll" class="btn" type="button">Limpiar filtros</button>
      </div>
    </div>
    <div class="crumbs" id="crumbs"></div>
    <div id="list"></div>
  </section>
  <aside id="detail" aria-label="Ficha del documento"></aside>
</main>
<div id="toast" role="status"></div>

<script>
"use strict";
const ROOT="__ID_CARPETA_DRIVE__", ROOT_NAME="DOCUMENTACION", SERVER="Google Drive";
const WIN_ROOT="G:\\.shortcut-targets-by-id\\"+ROOT+"\\"+ROOT_NAME;
const FOLDER="application/vnd.google-apps.folder";
const AUTO_MS=7*864e5, PAGE=150;
/* Nivel superior leído al publicar: permite orientarse mientras se conecta Drive. */
const SEED=[]; /* Versión de repositorio: identificadores de Drive excluidos. */
const TYPES=[["pdf","PDF","PDF","--t-pdf"],["xls","Excel","XLS","--t-xls"],["doc","Word","DOC","--t-doc"],["ppt","PowerPoint","PPT","--t-ppt"],["img","Imagen","IMG","--t-img"],["cad","CAD / BIM / GIS","CAD","--t-cad"],["mail","Correo","MSG","--t-mail"],["zip","Comprimido","ZIP","--t-zip"],["oth","Otros","OTR","--t-oth"]];
const TY=Object.fromEntries(TYPES.map(t=>[t[0],t]));
const EXT={pdf:"pdf",xlsx:"xls",xls:"xls",xlsm:"xls",csv:"xls",ods:"xls",docx:"doc",doc:"doc",odt:"doc",rtf:"doc",pptx:"ppt",ppt:"ppt",odp:"ppt",png:"img",jpg:"img",jpeg:"img",gif:"img",tif:"img",tiff:"img",bmp:"img",webp:"img",heic:"img",dwg:"cad",dxf:"cad",rvt:"cad",ifc:"cad",nwd:"cad",nwc:"cad",kmz:"cad",kml:"cad",shp:"cad",mpp:"cad",msg:"mail",eml:"mail",zip:"zip",rar:"zip","7z":"zip",tar:"zip",gz:"zip"};
const TEXT_OK=/^(application\/(pdf|msword|vnd\.google-apps\.(document|spreadsheet|presentation)|vnd\.openxmlformats-officedocument\.|vnd\.oasis\.opendocument\.|x-vnd\.oasis\.opendocument\.)|text\/|image\/(png|jpe?g))/;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const coll=new Intl.Collator("es",{numeric:true,sensitivity:"base"});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmtD=t=>{if(!t)return"—";const d=new Date(t);return isNaN(d)?"—":d.toLocaleDateString("es-CL",{day:"2-digit",month:"2-digit",year:"numeric"})};
const fmtDT=t=>{if(!t)return"—";const d=new Date(t);return isNaN(d)?"—":d.toLocaleString("es-CL",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})};
const fmtN=n=>Number(n||0).toLocaleString("es-CL");
function fmtS(b){if(!b)return"—";const u=["B","KB","MB","GB","TB"];let i=0,v=+b;while(v>=1024&&i<4){v/=1024;i++}return v.toLocaleString("es-CL",{maximumFractionDigits:v<10&&i?1:0})+" "+u[i]}
function typeOf(it){
  const m=it.m||"";
  if(m==="application/vnd.google-apps.spreadsheet")return"xls";
  if(m==="application/vnd.google-apps.document")return"doc";
  if(m==="application/vnd.google-apps.presentation")return"ppt";
  const e=(it.x||(/\.([a-z0-9]{1,6})$/i.exec(it.t||"")||[])[1]||"").toLowerCase();
  if(EXT[e])return EXT[e];
  if(m.startsWith("image/"))return"img";
  return"oth";
}
function short(o){return o?String(o).split("@")[0]:"—"}

/* ---------- Estado ---------- */
const items=new Map();
let kids=new Map(), stats=new Map();
const S={cur:ROOT,q:"",types:new Set(),owner:"",from:"",to:"",flat:false,sort:"name",dir:1,limit:PAGE,view:"list",sel:null,recent:false,hits:null,hitsQ:"",open:new Set([ROOT])};
let mcp=null, indexedAt=null, crawling=false, failed=[], shown=[], snippet=new Map();

function fromSeed(){
  for(const[id,t,f,s,md]of SEED)items.set(id,{id,t,m:f?FOLDER:(/xlsx$/.test(t)?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":""),s,p:ROOT,md,c:"",o:"",u:"",seed:1});
}
function up(f,seen){
  const it={id:f.id,t:f.title||f.name||"(sin nombre)",m:f.mimeType||"",s:+(f.fileSize||0),x:f.fileExtension||"",p:f.parentId||"",c:f.createdTime||"",md:f.modifiedTime||"",o:f.owner||"",u:(/^https:\/\//.test(f.viewUrl||"")?f.viewUrl:"")};
  items.set(it.id,it); if(seen)seen.add(it.id); return it;
}
function rebuild(){
  kids=new Map(); stats=new Map();
  for(const it of items.values()){if(!kids.has(it.p))kids.set(it.p,[]);kids.get(it.p).push(it)}
  for(const a of kids.values())a.sort((x,y)=>(y.m===FOLDER)-(x.m===FOLDER)||coll.compare(x.t,y.t));
  const walk=(id,seen)=>{const st={files:0,folders:0,size:0};if(seen.has(id))return st;seen.add(id);
    for(const k of kids.get(id)||[]){if(k.m===FOLDER){const c=walk(k.id,seen);st.folders+=1+c.folders;st.files+=c.files;st.size+=c.size}else{st.files++;st.size+=k.s}}
    stats.set(id,st);return st};
  walk(ROOT,new Set());
}
function pathOf(id){const out=[];let c=items.get(id),g=0;while(c&&g++<40){out.unshift(c);c=items.get(c.p)}return out}
function pathTxt(it){return pathOf(it.p).map(x=>x.t).join(" / ")}
function hay(it){return it._h||(it._h=norm(it.t+" "+pathTxt(it)))}
function under(it,root){if(root===ROOT)return stats.has(it.p)||it.p===ROOT;let p=it.p,g=0;while(p&&g++<40){if(p===root)return true;const c=items.get(p);p=c&&c.p}return false}
function hasFilter(){return !!(S.q||S.types.size||S.owner||S.from||S.to||S.recent)}

/* ---------- Conector Drive ---------- */
async function call(tool,input,tries){
  try{const r=await mcp.callTool(SERVER,tool,input,{cache:false});return r.payload}
  catch(e){if(e&&e.retryable&&!tries){await sleep((e.retryAfterMs||600)+Math.random()*700);return call(tool,input,1)}throw e}
}
const BLOCK={
  needs_reauth:"La sesión de Google Drive venció. Reconecte Google Drive en Configuración, Conectores, y pulse Reintentar.",
  server_not_connected:"Esta cuenta no tiene Google Drive conectado. Agréguelo en Configuración, Conectores, y pulse Reintentar.",
  selection_required:"Hay más de una conexión de Google Drive. Elija una en el aviso de conexión y pulse Reintentar.",
  not_in_manifest:"El acceso a Google Drive no está permitido para esta página. Actívelo en el aviso de permisos de la página.",
  blocked_by_policy:"La política de la organización bloquea este acceso a Google Drive.",
  approval_required:"Falta su autorización para leer Google Drive. Pulse Reintentar y acepte el aviso.",
  consent_required:"Falta su autorización para leer Google Drive. Pulse Reintentar y acepte el aviso.",
  not_granted:"Esta vista no tiene conexión con Google Drive.",
  capability_disabled:"Esta vista no tiene conexión con Google Drive."
};
async function listFolder(id,seen,enqueue){
  let token,guard=0;
  do{
    const input={query:"parentId = '"+id+"'",pageSize:100,excludeContentSnippets:true};
    if(token)input.pageToken=token;
    const p=await call("search_files",input)||{};
    for(const f of p.files||[]){const fresh=!seen.has(f.id);const it=up(f,seen);if(it.m===FOLDER&&fresh)enqueue(it.id)}
    token=p.nextPageToken;
  }while(token&&++guard<300);
}
let done=0,total=1,lastTry=0;
function prog(x){const p=$("prog");p.classList.toggle("on",x>=0);if(x>=0)p.firstChild.style.width=Math.max(2,x*100)+"%"}
async function crawl(){
  if(crawling||!mcp)return;
  crawling=true; prog(.02); lastTry=Date.now(); failed=[]; done=0; total=1; banner("");
  setStatus("busy","Indexando carpetas"); $("refresh").disabled=true;
  const seen=new Set(), q=[]; let active=0, fatal=null, last=0;
  const enqueue=id=>{q.push(id);total++};
  const tick=()=>{const n=Date.now();prog(done/total);setStatus("busy","Indexando "+fmtN(done)+" de "+fmtN(total)+" carpetas");if(n-last>700){last=n;rebuild();render()}};
  const one=async id=>{
    try{await listFolder(id,seen,enqueue)}
    catch(e){if(e&&BLOCK[e.code])fatal=e;else failed.push(id)}
    done++;tick();
  };
  await one(ROOT);
  const worker=async()=>{for(;;){if(fatal)return;const id=q.shift();if(id===undefined){if(!active)return;await sleep(60);continue}active++;await one(id);active--}};
  if(!fatal&&!failed.includes(ROOT))await Promise.all([worker(),worker(),worker(),worker()]);
  crawling=false; prog(-1); $("refresh").disabled=false;
  if(fatal){
    if(["needs_reauth","server_not_connected","blocked_by_policy","not_in_manifest"].includes(fatal.code)){if(!indexedAt){items.clear();fromSeed()}}
    rebuild();render();setStatus("err","Sin conexión con Drive");
    banner(BLOCK[fatal.code],true,"Reintentar",crawl);return;
  }
  if(failed.length===0||!failed.includes(ROOT)){
    if(!failed.length)for(const id of[...items.keys()])if(!seen.has(id))items.delete(id);
    indexedAt=Date.now();
    for(const it of items.values())delete it._h;
    rebuild();render();saveSnap();
    setStatus(failed.length?"err":"ok",(failed.length?"Última actualización parcial: ":"Última actualización: ")+fmtDT(indexedAt));
    if(failed.length)banner(failed.length+" carpeta(s) no respondieron y su contenido puede estar incompleto.",true,"Reintentar",crawl);
  }else{
    rebuild();render();setStatus("err","Drive no respondió");
    banner("Google Drive no respondió. Se mantiene la última información disponible.",true,"Reintentar",crawl);
  }
}
function hitsBanner(){
  if(!S.hits){banner("");return}
  banner(fmtN(S.hits.size)+" documento(s) contienen «"+S.hitsQ+"» en su texto."+(S.hitsCut?" La consulta alcanzó su límite: precise el término para asegurar un resultado completo.":""),false,"Volver a búsqueda por nombre",()=>{S.hits=null;snippet=new Map();banner("");render()});
}
async function contentSearch(){
  const terms=S.q.trim().split(/\s+/).filter(Boolean);
  if(!terms.length){toast("Escriba primero el texto a buscar");$("q").focus();return}
  if(!mcp){toast("Esta vista no tiene conexión con Google Drive");return}
  const b=$("ctSearch");b.disabled=true;b.textContent="Buscando…";
  try{
    const query=terms.map(t=>"fullText contains '"+t.replace(/\\/g,"\\\\").replace(/'/g,"\\'")+"'").join(" and ");
    const hits=new Set();let token,g=0;snippet=new Map();
    do{
      const input={query,pageSize:100,snippetVerbosity:"BRIEF"};if(token)input.pageToken=token;
      const p=await call("search_files",input)||{};
      for(const f of p.files||[]){
        if(f.mimeType===FOLDER||!stats.has(f.parentId))continue;
        const it=up(f);delete it._h;hits.add(it.id);
        if(f.contentSnippet)snippet.set(it.id,String(f.contentSnippet).replace(/\s+/g," ").slice(0,220));
      }
      token=p.nextPageToken;
    }while(token&&++g<30);
    const cut=!!token;
    rebuild();S.hits=hits;S.hitsQ=S.q;S.hitsCut=cut;S.limit=PAGE;hitsBanner();render();
  }catch(e){
    banner(e&&BLOCK[e.code]?BLOCK[e.code]:"La búsqueda en contenido no respondió. Intente nuevamente.",true);
  }finally{b.disabled=false;b.textContent="Buscar en contenido"}
}

/* ---------- Instantánea local del índice ---------- */
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("explorador-cyd",1);r.onupgradeneeded=()=>r.result.createObjectStore("s");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function saveSnap(){try{const d=await idb();const arr=[...items.values()].map(({_h,...x})=>x);d.transaction("s","readwrite").objectStore("s").put({at:indexedAt,items:arr},"snap")}catch(e){}}
async function loadSnap(){try{const d=await idb();return await new Promise(res=>{const r=d.transaction("s").objectStore("s").get("snap");r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}catch(e){return null}}

/* ---------- Filtrado ---------- */
function scope(deep){
  const filtering=hasFilter()||S.hits;
  let a;
  if(filtering||S.flat||deep){a=[...items.values()].filter(it=>it.m!==FOLDER&&under(it,S.cur))}
  else a=(kids.get(S.cur)||[]).slice();
  return{a,filtering};
}
function apply(ignoreType,deep){
  let{a,filtering}=scope(deep);
  if(S.hits)a=a.filter(it=>S.hits.has(it.id));
  else if(S.q){const tk=norm(S.q).split(/\s+/).filter(Boolean);a=a.filter(it=>{const h=hay(it);return tk.every(t=>h.includes(t))})}
  if(S.owner)a=a.filter(it=>it.o===S.owner);
  if(S.from)a=a.filter(it=>it.md&&it.md.slice(0,10)>=S.from);
  if(S.to)a=a.filter(it=>it.md&&it.md.slice(0,10)<=S.to);
  if(S.recent){const lim=new Date(Date.now()-7*864e5).toISOString();a=a.filter(it=>it.md>=lim)}
  if(!ignoreType&&S.types.size)a=a.filter(it=>it.m!==FOLDER&&S.types.has(typeOf(it)));
  return{a,filtering};
}
function sorted(a){
  const k=S.sort,d=S.dir;
  return a.slice().sort((x,y)=>{
    const f=(y.m===FOLDER)-(x.m===FOLDER); if(f)return f;
    let r=0;
    if(k==="name")r=coll.compare(x.t,y.t);
    else if(k==="md")r=(x.md||"").localeCompare(y.md||"");
    else if(k==="size")r=(x.s||0)-(y.s||0);
    else if(k==="type")r=typeOf(x).localeCompare(typeOf(y));
    else if(k==="owner")r=coll.compare(x.o||"",y.o||"");
    return r*d||coll.compare(x.t,y.t);
  });
}

/* ---------- Historial de consulta: volver y avanzar ---------- */
const H={list:[],pos:-1,lock:false};
let typing=null;
function snap(){return{cur:S.cur,q:S.q,types:[...S.types].sort(),owner:S.owner,from:S.from,to:S.to,flat:S.flat,recent:S.recent,sel:S.sel,hits:S.hits?[...S.hits]:null,hitsQ:S.hitsQ,cut:!!S.hitsCut,snip:S.hits?[...snippet]:[]}}
function navUI(){$("navB").disabled=H.pos<=0;$("navF").disabled=H.pos>=H.list.length-1}
function mark(){
  if(H.lock)return;
  const o=snap(),k=JSON.stringify({...o,snip:0});
  if(H.pos>=0&&H.list[H.pos].k===k)return;
  H.list.splice(H.pos+1);H.list.push({o,k});
  if(H.list.length>200)H.list.shift();
  H.pos=H.list.length-1;navUI();
}
function nav(d){
  if(typing){clearTimeout(typing);typing=null;mark()}
  const p=H.pos+d;if(p<0||p>=H.list.length)return;
  H.pos=p;const o=H.list[p].o;H.lock=true;
  Object.assign(S,{cur:o.cur,q:o.q,owner:o.owner,from:o.from,to:o.to,flat:o.flat,recent:o.recent,sel:o.sel,hitsQ:o.hitsQ,hitsCut:o.cut,limit:PAGE});
  S.types=new Set(o.types);S.hits=o.hits?new Set(o.hits):null;snippet=new Map(o.snip);
  $("q").value=o.q;$("from").value=o.from;$("to").value=o.to;$("flat").checked=o.flat;
  for(const x of pathOf(o.cur))S.open.add(x.id);S.open.add(o.cur);
  hitsBanner();render();$("list").scrollTop=0;H.lock=false;navUI();
}

/* ---------- Render ---------- */
function setStatus(c,t){$("status").className="status "+c;$("statusT").textContent=t}
function banner(msg,err,label,fn){
  const b=$("banner");
  if(!msg){b.className="";b.innerHTML="";return}
  b.className="show"+(err?" err":"");b.innerHTML="<span>"+esc(msg)+"</span>";
  if(label){const x=document.createElement("button");x.className="btn";x.type="button";x.textContent=label;x.onclick=fn;b.appendChild(x)}
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),1900)}
function badge(it){
  if(it.m===FOLDER)return '<svg width="30" height="20" viewBox="0 0 30 20" style="flex:none;color:var(--accent);margin-top:0" aria-label="Carpeta"><path d="M3 4h8l2 2.4h13v11H3z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
  const t=TY[typeOf(it)];return '<span class="ty" style="background:var('+t[3]+')">'+t[2]+"</span>";
}
function renderKpis(){
  const st=stats.get(ROOT)||{files:0,folders:0,size:0};
  let last=null,nw=0;const lim=new Date(Date.now()-7*864e5).toISOString();
  for(const it of items.values())if(it.m!==FOLDER){if(!last||it.md>last.md)last=it;if(it.md>=lim)nw++}
  $("kpis").innerHTML=
   '<div class="kpi"><b>'+fmtN(st.files)+'</b><span>Documentos indexados</span></div>'+
   '<div class="kpi"><b>'+fmtN(st.folders)+'</b><span>Carpetas</span></div>'+
   '<div class="kpi"><b>'+fmtS(st.size)+'</b><span>Volumen total</span></div>'+
   '<button type="button" id="kNew" class="kpi'+(S.recent?" on":"")+'"><b>'+fmtN(nw)+'</b><span>Modificados en 7 días · filtrar</span></button>'+
   '<div class="kpi"><b>'+(last?fmtD(last.md):"—")+'</b><span>Último documento modificado</span></div>';
  const vals=[...document.querySelectorAll("#kpis b")].map(b=>b.textContent);
  if(kpiPrev.length)vals.forEach((v,i)=>{if(v!==kpiPrev[i])$("kpis").children[i].classList.add("pulse")});
  kpiPrev=vals;
  $("kNew").onclick=()=>{S.recent=!S.recent;S.limit=PAGE;S.cur=ROOT;render()};
}
function renderTree(){
  const line=(it,d)=>{
    const sub=(kids.get(it.id)||[]).filter(k=>k.m===FOLDER),st=stats.get(it.id)||{files:0};
    const open=S.open.has(it.id),m=/^([A-Z])_(.+)$/.exec(it.t);
    let h='<div class="tn'+(S.cur===it.id?" cur":"")+'" style="padding-left:'+(d*13)+'px">'+
      (sub.length?'<button type="button" class="tw" data-tog="'+it.id+'" aria-label="'+(open?"Contraer":"Expandir")+' '+esc(it.t)+'" aria-expanded="'+open+'">'+(open?"▾":"▸")+"</button>":'<span class="tw"></span>')+
      '<button type="button" class="tl" data-go="'+it.id+'" style="color:inherit">'+(m?'<span class="ser">'+m[1]+"</span>"+esc(m[2].replace(/_/g," ")):esc(it.t))+"</button>"+
      '<span class="ct">'+fmtN(st.files)+"</span></div>";
    if(open)for(const k of sub)h+=line(k,d+1);
    return h;
  };
  $("tree").innerHTML=line({id:ROOT,t:ROOT_NAME,m:FOLDER},0);
}
function renderFacets(){
  const{a}=apply(true,true),c={};for(const it of a)if(it.m!==FOLDER){const t=typeOf(it);c[t]=(c[t]||0)+1}
  $("typeChips").innerHTML=TYPES.filter(t=>c[t[0]]||S.types.has(t[0])).map(t=>'<button type="button" class="chip'+(S.types.has(t[0])?" on":"")+'" data-t="'+t[0]+'" aria-pressed="'+S.types.has(t[0])+'">'+t[1]+" <i>"+fmtN(c[t[0]]||0)+"</i></button>").join("");
  const owners=[...new Set([...items.values()].map(i=>i.o).filter(Boolean))].sort();
  const sel=$("owner"),cur=S.owner;
  const html='<option value="">Todos</option>'+owners.map(o=>'<option value="'+esc(o)+'">'+esc(short(o))+"</option>").join("");
  if(sel.dataset.h!==html){sel.innerHTML=html;sel.dataset.h=html}
  sel.value=cur;
}
function renderCrumbs(n,filtering){
  const p=[{id:ROOT,t:ROOT_NAME},...(S.cur===ROOT?[]:pathOf(S.cur).filter(x=>x.id!==ROOT))];
  $("crumbs").innerHTML=p.map(x=>'<button type="button" data-go="'+x.id+'">'+esc(x.t)+"</button>").join('<span class="s">/</span>')+
    '<span class="sum">'+fmtN(n)+(filtering||S.flat?" resultado(s), incluye subcarpetas":" elemento(s)")+"</span>";
}
const th=(k,l,cls)=>'<th'+(cls?' class="'+cls+'"':"")+' aria-sort="'+(S.sort===k?(S.dir>0?"ascending":"descending"):"none")+'"><button type="button" data-s="'+k+'">'+l+(S.sort===k?(S.dir>0?" ↑":" ↓"):"")+"</button></th>";
let listKey="",kpiPrev=[];
function renderList(){
  const k=[S.cur,S.q,[...S.types],S.owner,S.from,S.to,S.flat,S.recent,S.hitsQ,!!S.hits,S.view].join("|"),anim=k!==listKey;listKey=k;
  const{a,filtering}=apply();
  shown=sorted(a);
  renderCrumbs(shown.length,filtering);
  const box=$("list");
  if(!shown.length){
    const loading=crawling&&!hasFilter();
    box.innerHTML='<div class="empty"><b>'+(loading?"Leyendo esta carpeta en Google Drive":filtering?"Sin documentos para este criterio":"Carpeta sin contenido indexado")+"</b>"+(filtering?"Amplíe las fechas, quite filtros de tipo o busque el texto con «Buscar en contenido».":loading?"Los documentos aparecerán a medida que se indexen.":"Pulse Actualizar índice si espera ver documentos aquí.")+"</div>";
    return;
  }
  const page=shown.slice(0,S.limit),showP=filtering||S.flat;
  let h;
  if(S.view==="cards"){
    h='<div id="cards">'+page.map(it=>{const st=stats.get(it.id);return'<button type="button" class="card'+(S.sel===it.id?" sel":"")+'" data-id="'+it.id+'">'+badge(it)+"<strong>"+esc(it.t)+'</strong><span class="pth">'+(it.m===FOLDER?fmtN(st&&st.files)+" documentos":fmtD(it.md)+" · "+fmtS(it.s))+"</span></button>"}).join("")+"</div>";
  }else{
    h="<table><thead><tr>"+th("name","Nombre")+th("md","Modificado")+th("size","Tamaño","cHide")+th("owner","Propietario","cHide")+"</tr></thead><tbody>"+
    page.map(it=>{const st=stats.get(it.id),sn=snippet.get(it.id);return'<tr class="row'+(S.sel===it.id?" sel":"")+'" data-id="'+it.id+'"><td><div class="nm">'+badge(it)+'<div><button type="button" class="nb">'+esc(it.t)+"</button>"+(showP?'<div class="pth">'+esc(pathTxt(it))+"</div>":"")+(sn&&S.hits?'<div class="snip">'+esc(sn)+"…</div>":"")+'</div></div></td><td class="n">'+fmtD(it.md)+'</td><td class="n cHide">'+(it.m===FOLDER?fmtN(st&&st.files)+" doc.":fmtS(it.s))+'</td><td class="n cHide">'+esc(short(it.o))+"</td></tr>"}).join("")+"</tbody></table>";
  }
  if(shown.length>S.limit)h+='<div class="more"><button type="button" id="more" class="btn">Mostrar '+Math.min(PAGE,shown.length-S.limit)+" más de "+fmtN(shown.length-S.limit)+" restantes</button></div>";
  box.innerHTML=h;
  if(anim)[...box.querySelectorAll("tr.row,.card")].slice(0,26).forEach((el,i)=>{el.style.setProperty("--i",i);el.classList.add("in")});
  const m=$("more");if(m)m.onclick=()=>{S.limit+=PAGE;renderList()};
}
function winPath(it){const p=pathOf(it.id).filter(x=>x.id!==ROOT).map(x=>x.t);return[WIN_ROOT,...p].join("\\")}
function url(it){return it.u||(it.m===FOLDER?"https://drive.google.com/drive/folders/"+it.id:"https://drive.google.com/file/d/"+it.id+"/view")}
function renderDetail(){
  const main=$("main"),it=S.sel&&items.get(S.sel);
  if(!it){main.classList.remove("detail");$("detail").innerHTML="";$("detail").dataset.id="";return}
  main.classList.add("detail");
  if($("detail").dataset.id===it.id)return;
  $("detail").dataset.id=it.id;
  const isF=it.m===FOLDER,st=stats.get(it.id)||{},t=!isF&&TY[typeOf(it)];
  const canTxt=!isF&&TEXT_OK.test(it.m);
  $("detail").innerHTML='<div class="dbody"><div class="dhead">'+badge(it)+"<h2>"+esc(it.t)+'</h2><button type="button" class="x" id="closeD" aria-label="Cerrar ficha">✕</button></div>'+
   '<div class="acts"><a class="btn primary" target="_blank" rel="noopener" href="'+esc(url(it))+'">Abrir en Drive</a>'+
   (isF?'<button type="button" class="btn" data-go="'+it.id+'">Entrar a la carpeta</button>':"")+
   '<button type="button" class="btn" id="cpU">Copiar enlace</button><button type="button" class="btn" id="cpP">Copiar ruta G:</button></div>'+
   "<dl><dt>Ubicación</dt><dd>"+esc(ROOT_NAME+(pathTxt(it)?" / "+pathTxt(it):""))+"</dd>"+
   (isF?"<dt>Documentos</dt><dd>"+fmtN(st.files)+"</dd><dt>Subcarpetas</dt><dd>"+fmtN(st.folders)+"</dd><dt>Volumen</dt><dd>"+fmtS(st.size)+"</dd>":"<dt>Tipo</dt><dd>"+esc(t[1])+"</dd><dt>Tamaño</dt><dd>"+fmtS(it.s)+"</dd>")+
   "<dt>Creado</dt><dd>"+fmtDT(it.c)+"</dd><dt>Modificado</dt><dd>"+fmtDT(it.md)+"</dd><dt>Propietario</dt><dd>"+esc(it.o||"—")+"</dd></dl>"+
   (canTxt?'<div class="acts"><button type="button" class="btn" id="readT">Leer texto del documento</button></div><pre id="txt" hidden></pre><p class="note" id="txtN">Extracto textual de Drive. Tablas y figuras pueden perder formato; el documento vigente es el de Drive.</p>':isF?"":'<p class="note">Este formato se consulta en Drive.</p>')+
   "</div>";
  $("closeD").onclick=()=>{S.sel=null;render()};
  const copy=(s,m)=>{navigator.clipboard.writeText(s).then(()=>toast(m),()=>toast("El navegador no permitió copiar"))};
  $("cpU").onclick=()=>copy(url(it),"Enlace copiado");
  $("cpP").onclick=()=>copy(winPath(it),"Ruta de Drive para escritorio copiada");
  const r=$("readT");
  if(r)r.onclick=async()=>{
    if(!mcp){toast("Esta vista no tiene conexión con Google Drive");return}
    r.disabled=true;r.textContent="Leyendo…";const box=$("txt");
    try{
      const p=await call("read_file_content",{fileId:it.id});
      const s=typeof p==="string"?p:(p&&(p.fileContent||p.content||p.text))||"";
      box.hidden=false;
      box.textContent=s?(s.length>60000?s.slice(0,60000)+"\n\n[Extracto truncado. Abra el documento en Drive para leerlo completo.]":s):"Drive no entregó texto para este documento.";
      r.textContent="Texto cargado";
    }catch(e){box.hidden=false;box.textContent=BLOCK[e&&e.code]||"Drive no pudo entregar el texto de este documento.";r.disabled=false;r.textContent="Reintentar lectura"}
  };
}
function render(){
  renderKpis();renderTree();renderFacets();renderList();renderDetail();
  $("clearq").style.display=S.q?"block":"none";
  if(!typing)mark();
  $("vList").classList.toggle("on",S.view==="list");$("vCards").classList.toggle("on",S.view==="cards");
  document.querySelectorAll("#datePre .chip").forEach(c=>{const d=new Date(Date.now()-c.dataset.d*864e5).toISOString().slice(0,10);c.classList.toggle("on",S.from===d&&!S.to)});
}
function go(id){S.cur=id;S.limit=PAGE;for(const x of pathOf(id))S.open.add(x.id);S.open.add(id);$("tree").classList.remove("open");if(!hasFilter())S.sel=null;render();$("list").scrollTop=0}

/* ---------- Eventos ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tog],[data-go],[data-s],[data-t],[data-d],[data-id]");
  if(!t)return;
  if(t.dataset.tog){const i=t.dataset.tog;S.open.has(i)?S.open.delete(i):S.open.add(i);renderTree();return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.s){if(S.sort===t.dataset.s)S.dir=-S.dir;else{S.sort=t.dataset.s;S.dir=t.dataset.s==="name"?1:-1}renderList();return}
  if(t.dataset.t){S.types.has(t.dataset.t)?S.types.delete(t.dataset.t):S.types.add(t.dataset.t);S.limit=PAGE;render();return}
  if(t.dataset.d){const d=new Date(Date.now()-t.dataset.d*864e5).toISOString().slice(0,10);if(S.from===d&&!S.to){S.from=""}else{S.from=d;S.to=""}$("from").value=S.from;$("to").value=S.to;S.limit=PAGE;render();return}
  if(t.dataset.id){const it=items.get(t.dataset.id);if(it&&it.m===FOLDER&&!e.target.closest(".x")){go(it.id);return}S.sel=t.dataset.id;renderList();renderDetail();mark();}
});
let deb;
$("q").addEventListener("input",e=>{clearTimeout(deb);deb=setTimeout(()=>{S.q=e.target.value.trim();S.limit=PAGE;if(S.hits&&S.q!==S.hitsQ){S.hits=null;snippet=new Map();banner("")}clearTimeout(typing);typing=setTimeout(()=>{typing=null;mark()},800);render()},130)});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();clearTimeout(deb);clearTimeout(typing);typing=null;S.q=e.target.value.trim();render()}});
$("clearq").onclick=()=>{$("q").value="";S.q="";S.hits=null;snippet=new Map();banner("");render();$("q").focus()};
$("ctSearch").onclick=()=>{S.q=$("q").value.trim();contentSearch()};
$("refresh").onclick=()=>{if(mcp)crawl();else toast("Esta vista no tiene conexión con Google Drive")};
$("vList").onclick=()=>{S.view="list";render()};$("vCards").onclick=()=>{S.view="cards";render()};
$("from").onchange=e=>{S.from=e.target.value;S.limit=PAGE;render()};
$("to").onchange=e=>{S.to=e.target.value;S.limit=PAGE;render()};
$("owner").onchange=e=>{S.owner=e.target.value;S.limit=PAGE;render()};
$("flat").onchange=e=>{S.flat=e.target.checked;S.limit=PAGE;render()};
$("navB").onclick=()=>nav(-1);$("navF").onclick=()=>nav(1);
$("menuTree").onclick=()=>$("tree").classList.toggle("open");
$("clearAll").onclick=()=>{Object.assign(S,{q:"",owner:"",from:"",to:"",recent:false,flat:false,hits:null,limit:PAGE});S.types.clear();snippet=new Map();$("q").value="";$("from").value="";$("to").value="";$("flat").checked=false;banner("");render()};
$("copyTsv").onclick=()=>{
  const rows=[["Nombre","Tipo","Ruta","Modificado","Tamaño (bytes)","Propietario","Enlace"].join("\t"),...shown.filter(i=>i.m!==FOLDER).map(i=>[i.t,TY[typeOf(i)][1],pathTxt(i),fmtD(i.md),i.s,i.o,url(i)].join("\t"))];
  navigator.clipboard.writeText(rows.join("\n")).then(()=>toast(fmtN(rows.length-1)+" filas copiadas; péguelas en Excel"),()=>toast("El navegador no permitió copiar"));
};
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$("q").focus()}
  if(e.key==="Escape"&&S.sel){S.sel=null;render()}
  if(e.altKey&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){e.preventDefault();nav(e.key==="ArrowLeft"?-1:1)}
});

(function(){var b=document.querySelector(".fondo");if(!b)return;var n=7,e=[],c=0,i;
for(i=1;i<=n;i++){var d=document.createElement("i");d.style.backgroundImage='url("fondos/'+i+'.jpg")';b.appendChild(d);e.push(d)}
e[0].className="on";
if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
setInterval(function(){e[c].className="";c=(c+1)%n;e[c].className="on"},14000)})();
/* ---------- Arranque ---------- */
(async function(){
  fromSeed();rebuild();render();setStatus("busy","Conectando con Google Drive");
  const snap=await loadSnap();
  if(snap&&snap.items&&snap.items.length){items.clear();for(const x of snap.items)items.set(x.id,x);indexedAt=snap.at;rebuild();render();setStatus("ok","Última actualización: "+fmtDT(indexedAt))}
  try{mcp=window.claude?await window.claude.use("mcp"):null}catch(e){mcp=null}
  if(!mcp){setStatus("err","Sin conexión con Drive");banner("Esta copia del repositorio es código fuente y no tiene conexión con Google Drive.",true,"Abrir panel en claude.ai",()=>{location.href="https://claude.ai/artifact/MFFk47NGSvPQMffjYbyyE7"});return}
  if(!indexedAt||Date.now()-indexedAt>AUTO_MS)crawl();
  setInterval(()=>{if(!crawling&&document.visibilityState==="visible"&&Date.now()-Math.max(lastTry,indexedAt||0)>=AUTO_MS)crawl()},3600000);
})();
</script>
