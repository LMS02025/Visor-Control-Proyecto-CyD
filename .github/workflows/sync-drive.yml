name: Sincronizar Libro de Obra desde Drive

on:
  # Programación desactivada: la carga automática la realiza la tarea programada de Claude
  # (scripts/cargar_folios.py). Reactivar solo si se configura el secret GDRIVE_SA_KEY con acceso a la carpeta.
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch: {}       # ejecución manual desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install --quiet google-api-python-client google-auth pypdf
      - name: Sincronizar folios nuevos
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          if [ -z "$GDRIVE_SA_KEY" ]; then echo "::error::Falta el secret GDRIVE_SA_KEY (Settings → Secrets and variables → Actions). Sin él no se leen folios nuevos y el visor queda desfasado."; exit 1; fi
          python scripts/sync_drive.py
      - name: Publicar cambios
        run: |
          if git diff --quiet -- data; then echo "Sin folios nuevos"; exit 0; fi
          git config user.name "drive-sync[bot]"
          git config user.email "drive-sync@users.noreply.github.com"
          git add data
          if git diff --quiet -- data/folios.json; then MSG="Testigo de sincronización con Drive (sin folios nuevos)"; else MSG="Sincroniza folios nuevos del Libro de Obra Digital"; fi
          git commit -m "$MSG"
          git push
